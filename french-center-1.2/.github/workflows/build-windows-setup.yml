name: Build French Center 1.2 Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "french-center-1.2/**"
      - ".github/workflows/build-windows-setup.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: french-center-1.2
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Add Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: french-center-1.2/package-lock.json

      - name: Install production libraries
        run: npm ci --omit=dev

      - name: Verify inventory editing and data preservation
        run: npm test

      - name: Prepare installer files
        shell: pwsh
        run: |
          $stage = "installer\stage"
          New-Item -ItemType Directory -Force "$stage\runtime", "$stage\data" | Out-Null
          $rootFiles = @("server.js", "package.json", "package-lock.json", "README.md", "تشغيل النظام.bat", "فتح ملف البيانات.bat")
          foreach ($file in $rootFiles) {
            Copy-Item -LiteralPath $file -Destination $stage
          }
          Copy-Item public "$stage\public" -Recurse
          Copy-Item node_modules "$stage\node_modules" -Recurse
          Copy-Item "data\main data 2.xlsx" "$stage\data\main data 2.xlsx"
          Copy-Item "installer\users-template.xlsx" "$stage\data\usre.xlsx"
          Copy-Item (node -p "process.execPath") "$stage\runtime\node.exe"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\FrenchCenter.iss"'

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrenchCenter-1.2-Windows-Setup
          path: french-center-1.2/installer/output/FrenchCenter-Setup-1.2.0.exe

      - name: Publish latest Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 "installer/output/FrenchCenter-Setup-1.2.0.exe" --clobber
          else
            gh release create v1.2.0 "installer/output/FrenchCenter-Setup-1.2.0.exe" --target "$GITHUB_SHA" --title "French Center 1.2.0 - Windows Setup" --notes "Unified product editing, live inventory search, ten stock alerts with show more, and the real inventory workbook. The first upgrade backs up the previous database before importing the real data."
          fi
